[package]
name    = "pharos-init"
version = "0.3.1"
edition = "2024"
rust-version.workspace = true
description = "Interactive project scaffolder for Pharos RS, guided by the decision matrix."
license = "MIT OR Apache-2.0"

[[bin]]
name = "pharos-init"
path = "src/main.rs"

[dependencies]
dialoguer = "0.12"
console   = "0.16"
indoc     = "2"

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
