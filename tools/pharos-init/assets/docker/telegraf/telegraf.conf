# Per-container metrics through the Docker API — immune to the daemon's storage
# driver, unlike cAdvisor, which dropped Docker support in v0.53 and breaks with
# the containerd-snapshotter storage newer engines use.
#
# CPU, memory and network per container; disk is covered host-wide by
# node-exporter.
[agent]
  interval = "10s"
  omit_hostname = true

[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  # Aggregates only — no series per CPU or per interface.
  perdevice_include = []
  total_include = ["cpu", "blkio", "network"]
  # Compose labels would become dozens of empty tags in Prometheus.
  docker_label_exclude = ["*"]

[[outputs.prometheus_client]]
  listen = ":9273"
  # No timestamps: Prometheus uses the moment of the scrape.
  export_timestamp = false
