# Tempo as a single binary with local storage, on the same reasoning as Loki:
# one application's trace volume needs neither object storage nor a split.
#
# No published port — the application pushes over OTLP and Grafana queries, both
# over the compose network.

server:
  http_listen_port: 3200
  # See the note in loki.yml: `info` narrates every Grafana query, and the
  # collector ships those back as logs.
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        # gRPC only: it is what the OTLP exporter uses with the grpc-tonic
        # feature, which is how `pharos-observability` is built.
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  # Close blocks on time even when they are small: a trace becomes queryable
  # sooner, and investigating a failure happens right after it.
  max_block_duration: 5m

compactor:
  compaction:
    # Matched to Loki's retention — a log line outliving the trace it points at
    # helps nobody.
    block_retention: 720h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# Derives RED metrics and a service graph from the spans themselves and writes
# them to Prometheus. The graph earns its keep once a second service joins the
# trace.
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      # Requires Prometheus to run with --web.enable-remote-write-receiver.
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  traces_storage:
    path: /var/tempo/generator/traces

overrides:
  defaults:
    metrics_generator:
      processors:
        - service-graphs
        - span-metrics

usage_report:
  reporting_enabled: false
