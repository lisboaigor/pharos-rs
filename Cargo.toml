[workspace]
resolver = "3"
members = [
    "crates/pharos-core",
    "crates/pharos-macros",
    "crates/pharos-messaging",
    "crates/pharos-app",
    "crates/pharos-memory",
    "crates/pharos-testing",
    "crates/pharos-axum",
    "crates/pharos-observability",
    "crates/pharos-saga",
    "crates/pharos-es",
    "crates/pharos-proto",
    "crates/pharos-realtime",
    "crates/pharos",
    "examples/order",
    "examples/multi-tenant",
    "examples/modular-monolith",
    "benches/pharos-benches",
]

[workspace.package]
# Minimum supported Rust version; checked by the `msrv` CI job.
rust-version = "1.98.0"

[workspace.dependencies]
# Version requirements below are pinned to major (or, for 0.x crates, to
# major.minor — the effective breaking boundary pre-1.0) rather than to an
# exact patch, e.g. "1" instead of "1.0.228", "0.4" instead of "0.4.45".
# `cargo update` alone then picks up new minor/patch releases within that
# range; Cargo.toml only needs a manual edit again on an actual major bump.
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
dashmap = "6"
futures = "0.3"
metrics = "0.24"
# `#[trait_variant::make(Send)]`: rewrites a trait's `async fn`/`-> impl
# Trait` methods in place to add `+ Send` to the returned future, so trait
# definitions read as plain `async fn` instead of hand-written `-> impl
# Future<Output = T> + Send`. Same trait name, same public API — this is a
# proc-macro-only dependency (no runtime component), maintained under
# rust-lang/impl-trait-utils.
trait-variant = "0.1"
syn = { version = "3", features = ["full"] }
quote = "1"
proc-macro2 = "1"
proc-macro-crate = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tower = { version = "0.5", features = ["util"] }
axum = "0.8"
# `pharos_axum::observability::request_span` was written for its `make_span_with`,
# yet nothing in the workspace instantiated a TraceLayer until now.
tower-http = { version = "0.7", features = ["trace", "request-id"] }
http = "1"
criterion = { version = "0.8", features = ["async_tokio"] }
prost = "0.14"
garde = { version = "0.23", features = ["derive"] }
fastrand = "2"

[workspace.lints.clippy]
# unwrap() and expect() are banned across the workspace. Use `?` or an explicit
# error type. In tests, prefer `?` on async functions. For infallible panics
# (e.g. mutex poisoning, test fixtures), use `let Ok(...) else { panic!() }`.
unwrap_used = "warn"
expect_used = "warn"
