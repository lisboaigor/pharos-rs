[package]
name = "pharos-postgres"
version = "0.5.0"
edition = "2024"
rust-version.workspace = true
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/lisboaigor/pharos-rs"
description = "Pooled PostgreSQL adapters (outbox, inbox, JSON aggregate repository) for Pharos RS."

[features]
# Both on by default so existing `pharos-postgres = { ... }` dependents keep
# building unchanged. Disable the one you don't use (`default-features =
# false, features = ["es"]` or `["saga"]`) to drop that adapter and its
# `pharos-es`/`pharos-saga` dependency entirely — CQRS without event sourcing
# (or without sagas) is then expressible against this adapter, not just
# against the domain layer.
default = ["es", "saga"]
es = ["dep:pharos-es"]
saga = ["dep:pharos-saga"]

[dependencies]
pharos-core = { path = "../pharos-core", version = "0.5.0" }
pharos-app  = { path = "../pharos-app", version = "0.5.0" }
pharos-es   = { path = "../pharos-es", version = "0.5.0", optional = true }
pharos-saga = { path = "../pharos-saga", version = "0.5.0", optional = true }

chrono     = { workspace = true }
metrics    = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
sqlx       = { workspace = true }
thiserror  = { workspace = true }
tracing    = { workspace = true }
uuid       = { workspace = true }

[dev-dependencies]
tokio          = { workspace = true }
testcontainers = { workspace = true }
dashmap        = { workspace = true }

[lints]
workspace = true
