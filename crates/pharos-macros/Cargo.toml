[package]
name = "pharos-macros"
version = "0.3.1"
edition = "2024"
rust-version.workspace = true
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/lisboaigor/pharos-rs"
description = "Proc-macros for Pharos RS, including derives and the id_type! helper."

[lib]
proc-macro = true

[dependencies]
syn              = { workspace = true }
quote            = { workspace = true }
proc-macro2      = { workspace = true }
proc-macro-crate = { workspace = true }

[dev-dependencies]
# Integration tests derive the real `pharos-app` traits and run them.
pharos-app     = { path = "../pharos-app", version = "0.3.1" }
# `Secret` is asserted to stay redacted inside the generated span.
pharos-core    = { path = "../pharos-core", version = "0.3.1" }
pharos-testing = { path = "../pharos-testing", version = "0.3.1" }
tokio          = { workspace = true }
tracing        = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
uuid           = { workspace = true }
# Exercises the generated `validate_input` bridge, including the tuple-struct
# case that `has_garde_fields` used to miss.
garde          = { workspace = true }

[lints]
workspace = true
