[package]
name = "pharos-memory"
version = "0.7.0"
edition = "2024"
rust-version.workspace = true
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/lisboaigor/pharos-rs"

[dependencies]
pharos-core    = { path = "../pharos-core", version = "0.7.0" }
pharos-app     = { path = "../pharos-app", version = "0.7.0" }
pharos-es      = { path = "../pharos-es", version = "0.7.0", optional = true }
pharos-saga    = { path = "../pharos-saga", version = "0.7.0", optional = true }
chrono      = { workspace = true }
dashmap     = { workspace = true }
futures     = { workspace = true }
metrics     = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
thiserror   = { workspace = true }
tokio       = { workspace = true, features = ["time"] }
tracing     = { workspace = true }
uuid        = { workspace = true }

[features]
# Both on by default, mirroring `pharos-postgres`: existing `pharos-memory =
# { ... }` dependents keep building unchanged. Disable the one you don't use
# to drop its adapter and dependency — CQRS-only usage never needed
# `InMemoryEventStore`/`InMemorySnapshotStore` or `InMemorySagaStore`.
default = ["es", "saga"]
es = ["dep:pharos-es"]
saga = ["dep:pharos-saga"]

[lints]
workspace = true
