[package]
name = "pharos-app"
version = "0.6.0"
edition = "2024"
rust-version.workspace = true
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/lisboaigor/pharos-rs"
description = "Application contracts for Pharos RS: command/query handlers, event bus, outbox, inbox, and messaging."

[dependencies]
pharos-core      = { path = "../pharos-core", version = "0.6.0" }
pharos-messaging = { path = "../pharos-messaging", version = "0.6.0", optional = true }
chrono      = { workspace = true }
serde       = { workspace = true }
metrics     = { workspace = true }
serde_json  = { workspace = true }
thiserror   = { workspace = true }
tokio       = { workspace = true, optional = true }
tower       = { workspace = true, optional = true }
tracing     = { workspace = true }
uuid        = { workspace = true }

[features]
default = ["messaging"]
# The broker-facing outbox/inbox/DLQ/retry surface (`save_and_enqueue`, the
# `resilience` decorators, `ApplicationError::Outbox`) and its
# `pharos-messaging` dependency. On by default so existing
# `pharos-app = { ... }` dependents keep building unchanged; disable it
# (`default-features = false`) for a pure CQRS/domain crate that only needs
# `Command`/`Query`/`EventBus` and never pulls in outbox, inbox, DLQ or
# consumer-group types.
messaging = ["dep:pharos-messaging"]
# Adapters exposing command/query handlers as `tower::Service`s.
tower = ["dep:tower"]
# Task-local tenant propagation (`CURRENT_TENANT`). Requires the Tokio runtime;
# the canonical, runtime-agnostic path is threading `TenantContext` explicitly.
tenant-task-local = ["dep:tokio"]
# `Retrying` event-handler decorator (backoff sleeps need Tokio's timer).
# Implies `messaging`: the decorator wraps message redelivery, which only
# exists when the outbox/inbox surface is present.
retry = ["dep:tokio", "tokio/time", "messaging"]

[dev-dependencies]
tokio = { workspace = true }
# The pipeline doctest composes real layers around a handler service.
tower = { workspace = true, features = ["limit", "timeout"] }

[lints]
workspace = true
