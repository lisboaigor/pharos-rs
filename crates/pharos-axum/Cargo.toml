[package]
name = "pharos-axum"
version = "0.4.0"
edition = "2024"
rust-version.workspace = true
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/lisboaigor/pharos-rs"
description = "Axum integration for Pharos command and query handlers."

[dependencies]
pharos-app  = { path = "../pharos-app", version = "0.4.0" }
pharos-core = { path = "../pharos-core", version = "0.4.0" }
axum = { workspace = true }
http = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
# The official Rust client: the `metrics` ecosystem has no exemplar support
# (open issue upstream), and without exemplars there is no jump from a latency
# observation to the trace behind it.
prometheus-client = "0.25"

[dev-dependencies]
# Captures what a span actually emits (a span without a subscriber is inert).
pharos-testing = { path = "../pharos-testing", version = "0.4.0" }
serde_json = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }

[lints]
workspace = true
